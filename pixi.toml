[project]
authors = ["Arjun Bakhale <arjun.bakhale@gmail.com>", "Konrad Rokicki <rokickik@hhmi.org>"]
channels = ["conda-forge"]
name = "gpt-semantic-search"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "osx-64"]
version = "0.1.0"

[dependencies]
# Python version constraint
python = "3.10.*"

# packages from conda-forge
pandas = "==2.2.2"
beautifulsoup4 = "==4.12.3"
httpx = "==0.27.2"
numpy = "<2.0.0"
rich = "<14"

[pypi-dependencies]
llama-index-embeddings-openai = "==0.1.7"
llama-index-llms-openai = "==0.1.19"
llama_index-embeddings-ollama = "*"
llama_index-llms-ollama = "*"
llama-index-vector-stores-weaviate = "==0.1.4"
llama-index-core = "==0.10.46"
llama-index-llms-llama-cpp = ">=0.1.0"
llama-index-agent-openai = ">=0.2.0"
llama-cpp-python = ">=0.2.0"
deepeval = "<3.1.3"
weaviate-client = "==3.26.2"
openai = "==1.30.1"
streamlit = "*"
slack-sdk = "==3.27.1"
scrapy = "==2.11.1"
html2text = "==2024.2.26"
slack-bolt = "*"
docling = ">=1.8.0, <2.0.0"
watchfiles = ">=0.18.0"
chardet = ">=5.0.0"
pytest = ">=7.0.0"

# No additional environments needed - docling is in base environment

[tasks]
eval-docling = { cmd = "python run_pipeline.py --scraper docling", cwd = "pdf_scraper_testing" }
