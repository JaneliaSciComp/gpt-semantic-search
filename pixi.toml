[project]
authors = ["Arjun Bakhale <arjun.bakhale@gmail.com>", "Konrad Rokicki <rokickik@hhmi.org>"]
channels = ["conda-forge"]
name = "gpt-semantic-search"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "osx-64"]
version = "0.1.0"

[dependencies]
# Python version constraint
python = "3.10.*"

# packages from conda-forge
pandas = "==2.2.2"
beautifulsoup4 = "==4.12.3"
httpx = "==0.27.2"
numpy = "<2.0.0"
rich = "<14"

[pypi-dependencies]
llama-index-embeddings-openai = "==0.1.7"
llama-index-llms-openai = "==0.1.19"
llama-index-vector-stores-weaviate = "==0.1.4"
llama-index-core = "==0.10.46"
deepeval = "<3.1.3"
weaviate-client = "==3.26.2"
openai = "==1.30.1"
streamlit = "*"
slack-sdk = "==3.27.1"
scrapy = "==2.11.1"
html2text = "==2024.2.26"
slack-bolt = "*"
# docling = "*"  # Temporarily disabled due to cmake requirement
unstructured = "*"
watchfiles = ">=0.18.0"
chardet = ">=5.0.0"
pytest = ">=7.0.0"

[environments]
docling-env = ["docling-env"]
unstructured-env = ["unstructured-env"]

[feature.docling-env.pypi-dependencies]
docling = ">=1.0.0, <2.0.0"

[feature.unstructured-env.dependencies]
qpdf = "*"
poppler = "*"
tesseract = "*"
libmagic = "*"
pkg-config = "*"
pikepdf = "*"

[feature.unstructured-env.pypi-dependencies]
unstructured = { version = ">=0.18.9, <0.19", extras = ["pdf"] }

[tasks]
eval-docling = { cmd = "python run_pipeline.py --scraper docling", cwd = "pdf_scraper_testing" }
eval-unstructured = { cmd = "python run_pipeline.py --scraper unstructured", cwd = "pdf_scraper_testing" }
