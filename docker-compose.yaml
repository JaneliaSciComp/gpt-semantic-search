services:

  weaviate:
    image: semitechnologies/weaviate:1.24.4
    ports:
    - 8777:8080
    restart: unless-stopped
    volumes:
      - ${WEAVIATE_STORAGE_PATH:-./storage/weaviate}:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      DEFAULT_VECTORIZER_MODULE: 'none'
      QUERY_DEFAULTS_LIMIT: 25
      CLUSTER_HOSTNAME: 'node1'
      DISABLE_TELEMETRY: 'true'
      LIMIT_RESOURCES: 'true'

  semantic-search:
    image: ghcr.io/janeliascicomp/gpt-semantic-search-web:0.5.0
    ports:
    - 8501:8501
    restart: unless-stopped
    environment:
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: 'none'
      STREAMLIT_SERVER_HEADLESS: 'true'
      WEAVIATE_URL: 'http://weaviate:8080'
      OPENAI_API_KEY:
      SLACK_TOKEN:

  nginx:
    image: nginx
    container_name: gpt-semantic-search_nginx
    restart: unless-stopped
    depends_on:
      - semantic-search
    ports:
      - 443:443
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/include:/etc/nginx/conf
      - ${CERT_DIR:-./certs}:/certs:ro
      - ${NGINX_CACHE_DIR:-./cache}:/var/cache/nginx

  slack-bot:
    image: ghcr.io/janeliascicomp/gpt-semantic-search-slack-bot:0.1.6
    restart: unless-stopped
    environment:
      WEAVIATE_URL: 'http://weaviate:8080'
      OPENAI_API_KEY: 
      SLACK_BOT_TOKEN: 
      SLACK_APP_TOKEN: 
      SLACK_TOKEN:
    depends_on:
      - weaviate

  filesystem-cli:
    image: ghcr.io/janeliascicomp/gpt-semantic-search-filesystem:latest
    container_name: filesystem-cli
    restart: "no"
    environment:
      WEAVIATE_URL: 'http://weaviate:8080'
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ${DOCUMENTS_PATH:-./documents}:/workspace
      - ./logs:/app/logs
    depends_on:
      - weaviate
    profiles:
      - filesystem
    command: ["--help"]

  # Development service with local build
  filesystem-dev:
    build:
      context: .
      dockerfile: docker/filesystem.dockerfile
    container_name: filesystem-dev
    restart: "no"
    environment:
      WEAVIATE_URL: 'http://weaviate:8080'
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ${DOCUMENTS_PATH:-./documents}:/workspace
      - ./logs:/app/logs
    depends_on:
      - weaviate
    profiles:
      - dev
    command: ["--help"]

  # Test runner service
  filesystem-test:
    build:
      context: .
      dockerfile: docker/filesystem.dockerfile
    container_name: filesystem-test
    restart: "no"
    environment:
      WEAVIATE_URL: 'http://weaviate:8080'
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PYTHONPATH: '/app'
    volumes:
      - ./test_data:/workspace
      - ./logs:/app/logs
      - ./tests:/app/tests
    depends_on:
      - weaviate
    profiles:
      - test
    command: ["pixi", "run", "python", "-m", "tests.test_filesystem_rag_integration"]

